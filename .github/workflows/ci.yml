name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-proxy:ci .
      - name: smoke-test the image
        run: |
          docker run -d --name smoke -p 3000:3000 ai-proxy:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
